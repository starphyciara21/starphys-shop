{% extends "base.html" %} 
{% block title %}Login - Starphys Cozy Crochet{% endblock %}

{% block content %}
<style>
    /* This makes the image cover the entire background of the page */
    .bg-image {
        background-image: url("{{ url_for('static', filename='images/login_crochet.jpg') }}");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        filter: blur(8px); /* Adjust this number to make it more or less blurry */
        height: 100vh;
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
    }

    /* This makes the login box float in the center and look semi-transparent */
    .login-container {
        background: rgba(255, 255, 255, 0.85); /* White with 85% transparency */
        backdrop-filter: blur(5px);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        margin: 100px auto;
    }
</style>

<div class="bg-image"></div>

<div class="login-container">
    <form method="POST">
        <h3 align="center" class="mb-4">Welcome Back</h3>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" />
        </div>
        <br />
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <div class="text-center mt-3">
        <small>New to Starphys? <a href="/sign-up">Create an account</a></small>
    </div>
</div>
{% endblock %}

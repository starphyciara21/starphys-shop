{% extends "base.html" %} 
{% block title %}Sign Up - Starphys Cozy Crochet{% endblock %}

{% block content %}
<style>
    .bg-image {
        background-image: url("{{ url_for('static', filename='images/signup_crochet.jpg') }}");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        filter: blur(8px);
        height: 100vh;
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
    }

    .signup-container {
        background: rgba(255, 255, 255, 0.85);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        max-width: 500px;
        margin: 50px auto;
    }
</style>

<div class="bg-image"></div>

<div class="signup-container">
    <form method="POST">
        <h3 align="center" class="mb-4">Join the Family</h3>
        
        <div class="form-group mb-3">
            <label for="firstName">First Name</label>
            <!-- Added value="{{ firstName }}" so the name stays if the form reloads -->
            <input 
                type="text" 
                class="form-control" 
                id="firstName" 
                name="firstName" 
                placeholder="Enter first name" 
                value="{{ firstName if firstName }}" 
            />
        </div>

        <div class="form-group mb-3">
            <label for="email">Email Address</label>
            <input 
                type="email" 
                class="form-control" 
                id="email" 
                name="email" 
                placeholder="Enter email" 
                value="{{ email if email }}" 
            />
        </div>

        <div class="form-group mb-3">
            <label for="password1">Password</label>
            <input 
                type="password" 
                class="form-control" 
                id="password1" 
                name="password1" 
                placeholder="Enter password" 
            />
        </div>

        <div class="form-group mb-3">
            <label for="password2">Confirm Password</label>
            <input 
                type="password" 
                class="form-control" 
                id="password2" 
                name="password2" 
                placeholder="Confirm password" 
            />
        </div>

        <br />
        <button type="submit" class="btn btn-success w-100">Sign Up</button>
    </form>
</div>
{% endblock %}
